      hosts:
        freva_host:
    db:
      hosts:
        freva_host:
    vault:
      hosts:
        freva_host:
    redis:
      hosts:
        freva_host:
    mongodb_server:
      hosts:
        freva_host:
    search_server:
      hosts:
        freva_host:
    freva_rest:
      hosts:
        freva_host:
    web:
      hosts:
        freva_host:
    # Add hosts here only when the optional data-loader scheduler is needed.
    data_portal_scheduler:
      hosts: {}
