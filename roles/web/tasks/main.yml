---
- name: Set custom nameserver fact from gathered facts
  ansible.builtin.set_fact:
    web_nameservers: >-
      {{ ansible_facts['dns'].nameservers
         | default([])
         | reject('search', ':')
         | list
         | join(' ') }}

- name: Run deployment with {{ deployment_method }}
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/systemd-based.yml"
  vars:
    deployment_file: >-
      {{ role_path }}/tasks/{{ deployment_method }}-deployment.yml
