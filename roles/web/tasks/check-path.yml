---
- name: Stat required path {{ item.desc }}
  ansible.builtin.stat:
    path: "{{ item.path | regex_replace('^~', ansible_facts.env.HOME) }}"
  register: __stat_result

- name: Reject a missing required path
  ansible.builtin.fail:
    msg: >
      Error: {{ item.desc }} not available on machine.
      Expected location: {{ item.path | regex_replace('^~', ansible_facts.env.HOME) }}
  when: not __stat_result.stat.exists
