---
- name: Adjust infrastructure
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    regexp: "^\\s*vm\\.overcommit_memory\\s*="
    line: "vm.overcommit_memory = 1"
    mode: "0644"
  register: cache_overcommit_config
  when:
    - ansible_become | bool
    - ansible_become_user == 'root'

- name: Apply the infrastructure adjustment
  ansible.builtin.command:
    argv:
      - sysctl
      - -w
      - vm.overcommit_memory=1
  changed_when: cache_overcommit_config.changed
  when:
    - ansible_become | bool
    - ansible_become_user == 'root'

- name: Running common tasks
  ansible.builtin.include_tasks: >-
    {{ role_path }}/../../playbooks/tasks/common_tasks.yml

- name: Select the cache configuration file
  ansible.builtin.set_fact:
    cache_config_file: >-
      {{
        service_config_dir + '/data-portal-cluster-config.json'
        if deployment_method == 'quadlet'
        else data_dir + '/config/data-portal-cluster-config.json'
      }}

- name: Register config path
  ansible.builtin.stat:
    path: "{{ cache_config_file }}"
  register: cache_config_path

- name: Set up caching
  when: >-
    deployment_method == 'quadlet'
    or not cache_config_path.stat.exists
    or (force | default(false) | bool)
  block:
    - name: Stop the cache service {{ cache_name }}
      ansible.builtin.systemd:
        name: "{{ cache_name }}"
        state: stopped
        enabled: false
        scope: "{{ 'system' if ansible_become | bool else 'user' }}"
      failed_when: false

    - name: Remove the old cache service file
      ansible.builtin.file:
        state: absent
        path: "{{ systemd_unit_dir }}/{{ cache_name }}.service"

    - name: Create the cache configuration directory
      ansible.builtin.file:
        state: directory
        owner: "{{ uid }}"
        group: "{{ gid }}"
        mode: "0750"
        path: >-
          {{
            service_config_dir
            if deployment_method == 'quadlet'
            else data_dir + '/config'
          }}

    - name: Write the Redis cache information
      ansible.builtin.copy:
        content: "{{ redis_information }}"
        dest: "{{ cache_config_file }}"
        owner: "{{ uid }}"
        group: "{{ gid }}"
        mode: "0600"

    - name: Run cache tasks for {{ deployment_method }}
      ansible.builtin.include_tasks:
        file: "{{ deployment_file | trim }}"
