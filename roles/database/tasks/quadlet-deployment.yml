---
- name: Define the database Quadlet
  ansible.builtin.set_fact:
    database_quadlet_state_directories:
      - path: "{{ service_state_dir }}/data"
        legacy_volume: "{{ db_name }}_data"
        legacy_paths:
          - "{{ legacy_data_dir }}/data"
      - path: "{{ service_state_dir }}/logs"
        legacy_volume: "{{ db_name }}_logs"
        legacy_paths:
          - "{{ legacy_data_dir }}/logs"
    database_quadlet_networks: []
    database_migration_uid: >-
      {{ uid if quadlet_rootful else '0' }}
    database_migration_gid: >-
      {{ gid if quadlet_rootful else '0' }}
    database_quadlet_containers:
      - name: "{{ db_name }}"
        description: Freva MySQL database
        image: "ghcr.io/freva-org/freva-mysql:{{ db_version }}"
        user: >-
          {{ (uid ~ ':' ~ gid) if quadlet_rootful else '0:0' }}
        environment:
          ROOT_PW: "{{ root_passwd }}"
          HOST: "{{ db_host }}"
          PROJECT: "{{ project_name }}"
          MYSQL_USER: "{{ db_user }}"
          MYSQL_PASSWORD: "{{ db_passwd }}"
          MYSQL_DATABASE: "{{ db }}"
          MYSQL_ROOT_PASSWORD: "{{ root_passwd }}"
        ports:
          - "{{ db_port }}:3306"
        volumes:
          - "{{ service_state_dir }}/data:/data/db:z"
          - "{{ service_state_dir }}/logs:/data/logs:z"
  no_log: true

- name: Load the Quadlet runtime for database migration checks
  ansible.builtin.include_tasks: >-
    {{ role_path }}/../../playbooks/tasks/get_quadlet_runtime.yml

- name: Prepare the database state
  ansible.builtin.include_tasks: >-
    {{ role_path }}/../../playbooks/tasks/prepare_quadlet_state.yml
  vars:
    quadlet_state_directories: "{{ database_quadlet_state_directories }}"

- name: Read the database upgrade marker
  ansible.builtin.shell: >-
    cat {{ (service_state_dir + '/data/mysql_upgrade_info') | quote }}
    2>/dev/null ||
    cat {{ (service_state_dir + '/data/mariadb_upgrade_info') | quote }}
    2>/dev/null || echo mysql
  register: database_upgrade_marker
  changed_when: false

- name: Migrate an existing MariaDB volume to MySQL
  when: "'mariadb' in database_upgrade_marker.stdout | lower"
  block:
    - name: Recreate the temporary database backup directory
      ansible.builtin.file:
        path: "{{ service_state_dir }}/migration-backup"
        state: directory
        owner: "{{ uid }}"
        group: "{{ gid }}"
        mode: "0700"

    - name: Back up the MariaDB data directory
      ansible.builtin.command:
        argv:
          - tar
          - czf
          - "{{ service_state_dir }}/migration-backup/mysql-backup.tar.gz"
          - -C
          - "{{ service_state_dir }}/data"
          - .
      changed_when: true

    - name: Run the MariaDB to MySQL migration
      ansible.builtin.include_tasks: mariadb_to_mysql_quadlet.yml

  rescue:
    - name: Restore the MariaDB data volume after a failed migration
      ansible.builtin.shell: >-
        find {{ (service_state_dir + '/data') | quote }}
        -mindepth 1 -delete &&
        tar xzf
        {{ (service_state_dir + '/migration-backup/mysql-backup.tar.gz') | quote }}
        -C {{ (service_state_dir + '/data') | quote }}
      changed_when: true

    - name: Stop after restoring the original MariaDB data
      ansible.builtin.fail:
        msg: >-
          MariaDB to MySQL migration failed. The original data volume was
          restored and the deployment was stopped.

  always:
    - name: Remove a temporary database container
      ansible.builtin.command:
        argv:
          - "{{ podman_bin }}"
          - rm
          - --force
          - temp-db
      changed_when: false
      failed_when: false

    - name: Remove the temporary database backup directory
      ansible.builtin.file:
        path: "{{ service_state_dir }}/migration-backup"
        state: absent

- name: Deploy the database Quadlet
  ansible.builtin.include_tasks: >-
    {{ role_path }}/../../playbooks/tasks/deploy_quadlets.yml
  vars:
    quadlet_state_directories: "{{ database_quadlet_state_directories }}"
    quadlet_networks: "{{ database_quadlet_networks }}"
    quadlet_containers: "{{ database_quadlet_containers }}"
    quadlet_skip_state_preparation: true
