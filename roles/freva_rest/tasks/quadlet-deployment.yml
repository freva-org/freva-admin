---
- name: Define the Freva REST environment
  ansible.builtin.set_fact:
    freva_rest_quadlet_environment:
      API_SOLR_CORE: files
      API_PORT: "{{ freva_rest_port }}"
      API_PROXY: "{{ freva_rest_proxy_url }}"
      COLUMNS: "140"
      API_OIDC_CLIENT_ID: "{{ freva_rest_oidc_client }}"
      API_OIDC_DISCOVERY_URL: "{{ freva_rest_oidc_url }}"
      API_OIDC_CLIENT_SECRET: "{{ freva_rest_oidc_client_secret }}"
      API_OIDC_TOKEN_CLAIMS: "{{ freva_rest_oidc_token_claims | join(',') }}"
      API_ADMIN_CLAIMS: "{{ freva_rest_oidc_admin_claims | join(',') }}"
      API_OIDC_SYSTEMUSER_CLAIM: "{{ freva_rest_oidc_systemuser_claim }}"
      API_OIDC_TRUSTED_ISSUERS: >-
        {{ freva_rest_oidc_trusted_issuers | join(',') }}
      API_OIDC_SCOPES: "{{ freva_rest_oidc_scopes }}"
      API_MONGO_USER: "{{ freva_rest_db_user }}"
      API_LOGDIR: /tmp/logs
      API_SOLR_HOST: "{{ freva_rest_search_server_host }}:8983"
      API_MONGO_HOST: "{{ freva_rest_mongodb_server_host }}:27017"
      API_MONGO_PASSWORD: "{{ freva_rest_db_passwd }}"
      API_MONGO_DB: search_stats
      API_SERVICES: "{{ freva_rest_services }}"
  no_log: true

- name: Add data-loader cache settings to the Freva REST environment
  ansible.builtin.set_fact:
    freva_rest_quadlet_environment: >-
      {{ freva_rest_quadlet_environment | combine({
        'API_REDIS_HOST': cache_information.host,
        'API_REDIS_PASSWORD': cache_information.passwd,
        'API_REDIS_USER': cache_information.user,
        'API_REDIS_SSL_CERTFILE': '/certs/client-cert.pem',
        'API_REDIS_SSL_KEYFILE': '/certs/client-key.pem',
        'CACHE_CONFIG': cache_information_enc
      }) }}
  when: freva_rest_data_loader
  no_log: true

- name: Define the Freva REST Quadlet
  ansible.builtin.set_fact:
    freva_rest_quadlet_state_directories:
      - path: "{{ service_state_dir }}/logs"
        legacy_volume: "{{ freva_rest_name }}_logs"
        legacy_paths:
          - "{{ legacy_data_dir }}/logs"
    freva_rest_quadlet_networks: []
    freva_rest_quadlet_containers:
      - name: "{{ freva_rest_name }}"
        description: Freva REST API
        image: "ghcr.io/freva-org/freva-rest-api:{{ freva_rest_version }}"
        user: >-
          {{ (uid ~ ':' ~ gid) if quadlet_rootful else '0:0' }}
        environment: "{{ freva_rest_quadlet_environment }}"
        ports:
          - "{{ freva_rest_port }}:{{ freva_rest_port }}"
        volumes:
          - /var/lib/sss/pipes:/var/lib/sss/pipes:ro
          - "{{ service_state_dir }}/logs:/tmp/logs:z"
  no_log: true

- name: Deploy the Freva REST Quadlet
  ansible.builtin.include_tasks: >-
    {{ role_path }}/../../playbooks/tasks/deploy_quadlets.yml
  vars:
    quadlet_state_directories: "{{ freva_rest_quadlet_state_directories }}"
    quadlet_networks: "{{ freva_rest_quadlet_networks }}"
    quadlet_containers: "{{ freva_rest_quadlet_containers }}"
