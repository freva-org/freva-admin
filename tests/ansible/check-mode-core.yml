---
- name: Verify the core role supports check mode
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    core_install_dir: /opt/freva
    core_root_dir: /var/lib/freva/check-mode/core
  roles:
    - role: core
  post_tasks:
    - name: Verify the shared micromamba tasks support check mode
      ansible.builtin.include_tasks: >-
        {{ playbook_dir }}/../../playbooks/tasks/install_micromamba.yml
      vars:
        micromamba_destination: /var/lib/freva/check-mode/micromamba

- name: Verify Quadlet runtime discovery supports check mode
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    ansible_become: false
    ansible_become_user: root
    deployment_config_root: /etc/freva/check-mode
    quadlet_rootful: true
  tasks:
    - name: Run the Quadlet runtime discovery tasks
      ansible.builtin.include_tasks: >-
        {{ playbook_dir }}/../../playbooks/tasks/get_quadlet_runtime.yml

- name: Verify Quadlet deployment supports check mode
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    ansible_become: false
    ansible_become_user: root
    deployment_config_root: /etc/freva/check-mode
    freva_deployment_root: "{{ playbook_dir }}/../.."
    quadlet_containers:
      - name: freva-check-mode
        description: Check-mode regression service
        image: example.invalid/freva/check-mode:latest
        environment:
          CHECK_MODE_VALUE: configured
    quadlet_networks: []
    quadlet_obsolete_container_names: []
    quadlet_rootful: true
    quadlet_skip_state_preparation: true
    service_config_dir: /etc/freva/check-mode/config
    uid: "0"
    gid: "0"
  tasks:
    - name: Run the shared Quadlet deployment tasks
      ansible.builtin.include_tasks: >-
        {{ playbook_dir }}/../../playbooks/tasks/deploy_quadlets.yml
