[Container]
EnvironmentFile=/etc/semaphore/kerberos.env
Volume=/etc/semaphore/krb5.conf:/etc/krb5.conf:ro,Z
Volume=/run/semaphore-krb5:/run/semaphore-krb5:Z
Volume=/etc/semaphore/ssh:/home/semaphore/.ssh:ro,Z

[Service]
ExecStartPre=/usr/bin/install -d -o 1001 -g 0 -m 0700 /run/semaphore-krb5
ExecStartPre=/usr/bin/test -s /etc/semaphore/krb5.conf
ExecStartPre=/usr/bin/test -s /etc/semaphore/ssh/config
ExecStartPre=/usr/bin/test -s /etc/semaphore/ssh/known_hosts
