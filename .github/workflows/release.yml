---
name: Package deployment assets

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Install Ansible
        run: python -m pip install "ansible-core>=2.15,<2.20"

      - name: Set package versions from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -n "$version"
          sed -i -E "s/^version: .*/version: $version/" galaxy.yml
          sed -i -E "s/^version: .*/version: $version/" charts/freva/Chart.yaml

      - name: Package the Ansible collection and Helm chart
        run: |
          mkdir -p dist
          ansible-galaxy collection build . --output-path dist
          helm package charts/freva --destination dist

      - name: Attach packages to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
