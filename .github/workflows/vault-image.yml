---
name: Build Freva Vault image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - vault/**
      - .github/workflows/vault-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read the Vault version
        id: version
        run: |
          version=$(awk -F '"' '/^VERSION = / {print $2}' vault/runserver.py)
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: vault
          platforms: linux/amd64,linux/arm64,linux/ppc64le
          push: true
          tags: |
            ghcr.io/freva-org/freva-vault:${{ steps.version.outputs.value }}
            ghcr.io/freva-org/freva-vault:latest
